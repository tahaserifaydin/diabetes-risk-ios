name: DiabetesRisk
options:
  bundleIdPrefix: com.tahaserif
  deploymentTarget:
    iOS: "17.0"
targets:
  DiabetesRisk:
    type: application
    platform: iOS
    sources: [DiabetesRisk]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tahaserif.DiabetesRisk
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Diabetes Risk
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
